    <style>
      body:has(#root > .yerh-loader--screen) {
        margin: 0;
      }
      .yerh-loader {
        --loader-size: 110px;
        display: grid;
        min-height: min(52vh, 25rem);
        place-items: center;
        color: #192c57;
      }
      .yerh-loader--screen {
        min-height: 100vh;
        min-height: 100dvh;
        background: #f6f7fb;
      }
      :root[data-dashboard-theme='dark'] body:has(#root > .yerh-loader--screen),
      :root[data-dashboard-theme='dark'] .yerh-loader--screen {
        background: #1a2536;
      }
      :root[data-dashboard-theme='dark'] .yerh-loader {
        color: #e7edf8;
      }
      :root[data-dashboard-theme='dark'] .yerh-loader__emblem img {
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.6);
      }
      .yerh-loader__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        padding-inline: 16px;
      }
      .yerh-loader__wait {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #192c57;
      }
      :root[data-dashboard-theme='dark'] .yerh-loader__wait {
        color: #e7edf8;
      }
      .yerh-dots {
        display: inline-flex;
        min-width: 1.55em;
        letter-spacing: 0.08em;
      }
      .yerh-loader__emblem {
        position: relative;
        display: grid;
        width: var(--loader-size);
        aspect-ratio: 1;
        place-items: center;
        isolation: isolate;
      }
      .yerh-loader__emblem::before,
      .yerh-loader__emblem::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        border-radius: 50%;
        content: '';
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      }
      .yerh-loader__emblem::before {
        background: conic-gradient(
          transparent 2deg,
          #215fc9 23deg,
          #8cc6ff 32deg,
          transparent 52deg 108deg,
          #cbae2d 125deg,
          #ffe296 135deg,
          transparent 157deg
        );
      }
      .yerh-loader__emblem::after {
        inset: 6px;
        background: conic-gradient(
          from 215deg,
          transparent 5deg,
          #e32938 34deg,
          #ff918a 42deg,
          transparent 59deg
        );
      }
      .yerh-loader__emblem img {
        display: block;
        width: 72%;
        height: auto;
        border-radius: 50%;
        box-shadow: 0 8px 26px #192c5733;
      }
      @media (prefers-reduced-motion: no-preference) {
        .yerh-loader__emblem::before {
          animation: yerh-loader-orbit 2.1s linear infinite;
        }
        .yerh-loader__emblem::after {
          animation: yerh-loader-orbit 1.45s linear reverse infinite;
        }
        .yerh-loader__emblem img {
          animation: yerh-loader-bounce 1.55s cubic-bezier(0.45, 0, 0.28, 1) infinite;
        }
        .yerh-dots span:nth-child(1) {
          animation: yerh-dot-1 1.6s steps(1, end) infinite;
        }
        .yerh-dots span:nth-child(2) {
          animation: yerh-dot-2 1.6s steps(1, end) infinite;
        }
        .yerh-dots span:nth-child(3) {
          animation: yerh-dot-3 1.6s steps(1, end) infinite;
        }
        .yerh-dots span:nth-child(4) {
          animation: yerh-dot-4 1.6s steps(1, end) infinite;
        }
      }
      @keyframes yerh-dot-1 {
        0%,
        100% {
          opacity: 0;
        }
        15%,
        94% {
          opacity: 1;
        }
      }
      @keyframes yerh-dot-2 {
        0%,
        100% {
          opacity: 0;
        }
        35%,
        94% {
          opacity: 1;
        }
      }
      @keyframes yerh-dot-3 {
        0%,
        100% {
          opacity: 0;
        }
        55%,
        94% {
          opacity: 1;
        }
      }
      @keyframes yerh-dot-4 {
        0%,
        100% {
          opacity: 0;
        }
        75%,
        94% {
          opacity: 1;
        }
      }
      @keyframes yerh-loader-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes yerh-loader-bounce {
        0%,
        100% {
          transform: translateY(5px) scale(0.9);
        }
        50% {
          transform: translateY(-8px) scale(1.09);
        }
        72% {
          transform: translateY(1px) scale(0.97);
        }
        86% {
          transform: translateY(-2px) scale(1);
        }
      }
    </style>
